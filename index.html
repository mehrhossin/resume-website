<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهر حسین - خانه</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .btn-resume {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            color: #667eea;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            animation: slideInLeft 1s ease 0.6s both;
        }

        .btn-resume:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            background: #f0f0f0;
        }

        .social-links {
            margin-top: 50px;
            animation: fadeIn 1s ease 0.9s both;
        }

        .social-links a {
            color: white;
            margin: 0 15px;
            font-size: 1.1rem;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .social-links a:hover {
            opacity: 1;
        }

        /* انیمیشن‌ها */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                left: -100px;
            }
            to {
                opacity: 1;
                left: 30px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }

            .btn-resume {
                position: static;
                transform: none;
                display: inline-block;
                margin-top: 30px;
            }

            .btn-resume:hover {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <a href="resume.html" class="btn-resume">📄 رزومه من</a>
    
    <div class="container">
        <h1>سلام، من مهر حسین هستم</h1>
        <p class="subtitle">توسعه‌دهنده بک‌اند | ASP.NET Core | Unity</p>
        
        <div class="social-links">
            <a href="https://github.com/mehrhossin" target="_blank">GitHub</a>
            <a href="mailto:your-email@example.com">ایمیل</a>
        </div>
    </div>
</body>
</html>
