<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">PlayWin — architecture overview</title>
  <desc id="description">Admin panels communicate with an ASP.NET Core backend. The backend uses Redis and MySQL, coordinates Unity Headless game servers through an internal API, and handles console authentication, lobby and economy through SignalR. Consoles connect directly to game servers through Mirror KCP over UDP for gameplay. This is an architecture illustration, not live telemetry.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#203244" stroke-opacity=".4"/></pattern>
    <marker id="mint-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#7ce4c3"/></marker>
    <marker id="blue-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#79bcff"/></marker>
    <marker id="amber-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#f4c17c"/></marker>
  </defs>
  <rect width="960" height="640" rx="6" fill="#0b1320"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <g font-family="Vazirmatn, Segoe UI, Tahoma, sans-serif">
    <text x="42" y="43" font-size="16" font-weight="700" fill="#eff3f4">PlayWin</text>
    <text x="918" y="43" text-anchor="end" font-size="11" letter-spacing="2" fill="#abb9c8">SYSTEM ARCHITECTURE</text>
    <rect x="235" y="75" width="490" height="86" rx="5" fill="#152132" stroke="#526c88"/>
    <text x="480" y="108" text-anchor="middle" font-size="19" font-weight="700" fill="#eff3f4">Admin Panels</text>
    <text x="480" y="137" text-anchor="middle" font-size="12" fill="#b6c7d7">Users · Devices · Finance · Monitoring · Support</text>
    <path d="M480 166V225" fill="none" stroke="#79bcff" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <text x="497" y="202" font-size="12" fill="#a9cff5">REST API / JWT</text>
    <rect x="235" y="232" width="490" height="130" rx="5" fill="#132f38" stroke="#7ce4c3" stroke-width="1.5"/>
    <text x="480" y="266" text-anchor="middle" font-size="23" font-weight="700" fill="#a4f0d8">ASP.NET Core 8</text>
    <text x="480" y="295" text-anchor="middle" font-size="13" fill="#e0eaf0">Authentication · Matchmaking · Economy · Results</text>
    <rect x="302" y="315" width="356" height="27" rx="3" fill="#0b202a" stroke="#33515b"/>
    <text x="480" y="334" text-anchor="middle" font-size="12" fill="#a4f0d8">C# / SignalR / Device + Player + Admin JWT</text>
    <rect x="25" y="253" width="165" height="88" rx="5" fill="#132132" stroke="#5679a1"/>
    <text x="107" y="286" text-anchor="middle" font-size="20" font-weight="700" fill="#e0eaf0">Redis + Lua</text>
    <text x="107" y="313" text-anchor="middle" font-size="11" fill="#b6c7d7">Queues · State · Join tokens</text>
    <path d="M196 297H228" stroke="#79bcff" stroke-width="2" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
    <rect x="770" y="253" width="165" height="88" rx="5" fill="#132132" stroke="#5679a1"/>
    <text x="852" y="286" text-anchor="middle" font-size="20" font-weight="700" fill="#e0eaf0">MySQL</text>
    <text x="852" y="313" text-anchor="middle" font-size="12" fill="#b6c7d7">Dapper · Transactions</text>
    <path d="M732 297H763" stroke="#79bcff" stroke-width="2" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
    <path d="M340 369V410H235V449" fill="none" stroke="#79bcff" stroke-width="2" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
    <text x="160" y="398" font-size="12" fill="#a9cff5">Internal API / Session results</text>
    <path d="M620 369V410H725V449" fill="none" stroke="#7ce4c3" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#mint-arrow)" marker-end="url(#mint-arrow)"/>
    <text x="622" y="398" font-size="12" fill="#a4f0d8">SignalR / Lobby + Events</text>
    <rect x="60" y="456" width="350" height="109" rx="5" fill="#152132" stroke="#79bcff"/>
    <text x="235" y="490" text-anchor="middle" font-size="21" font-weight="700" fill="#e0eaf0">Unity Headless</text>
    <text x="235" y="518" text-anchor="middle" font-size="13" fill="#b6c7d7">Game servers / Room state / Gameplay</text>
    <text x="235" y="543" text-anchor="middle" font-size="11" fill="#a9cff5">Match lifecycle · Reconnect · Result reporting</text>
    <rect x="550" y="456" width="350" height="109" rx="5" fill="#152132" stroke="#7ce4c3"/>
    <text x="725" y="490" text-anchor="middle" font-size="21" font-weight="700" fill="#e0eaf0">Unity Console</text>
    <text x="725" y="518" text-anchor="middle" font-size="13" fill="#b6c7d7">Device + Player / Lobby / Game launch</text>
    <text x="725" y="543" text-anchor="middle" font-size="11" fill="#a4f0d8">GameSession.json → Game client</text>
    <path d="M418 510H542" fill="none" stroke="#f4c17c" stroke-width="2.5" marker-start="url(#amber-arrow)" marker-end="url(#amber-arrow)"/>
    <text x="480" y="478" text-anchor="middle" font-size="12" font-weight="700" fill="#f4c17c">Mirror KCP</text>
    <text x="480" y="540" text-anchor="middle" font-size="11" fill="#f4c17c">UDP gameplay</text>
    <path d="M42 592H918" stroke="#263545"/>
    <text x="42" y="619" font-size="11" fill="#abb9c8">AUTHORITY: Backend / economy + results · Game server / gameplay</text>
    <text x="918" y="619" text-anchor="end" font-size="10" fill="#7ce4c3">ARCHITECTURE ILLUSTRATION</text>
  </g>
</svg>
